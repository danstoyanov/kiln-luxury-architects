<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
<title id="title">KILN — architecture and data flow</title><desc id="desc">Reviewed GitHub source is built into static files and deployed to GPT Sites. A visitor requests static responses. Navigation, wordmark fitting and enquiry validation run locally in the browser. Enquiry values are never sent or stored by the application.</desc>
<defs>
<marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#A64C25"/></marker>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#235D95"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#7045A2"/></marker>
<marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#357348"/></marker>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#08756C"/></marker>
<marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#A63C4F"/></marker>
<marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#89610F"/></marker>
</defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243243}.title{font-size:42px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:20px;fill:#506073}.zone{font-size:17px;font-weight:700;letter-spacing:1.5px}.heading{font-size:23px;font-weight:700}.copy{font-size:17px;fill:#46566A}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round}.foot{font-size:17px;fill:#506073}</style><rect width="1600" height="1320" fill="#FAFBFD"/>
<text x="80" y="82" class="title">KILN / Architecture &amp; data flow</text>
<text x="80" y="119" class="subtitle">One static page. Reviewed releases. Local browser interactions.</text>
