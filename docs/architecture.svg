<path d="M1200 1060H1280" fill="none" stroke="#A63C4F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/>
<text x="1211" y="1041" class="label" style="fill:#A63C4F">Validate</text>
<text x="100" y="1260" class="foot">Form invariant: no submission request, email, browser storage or persisted enquiry.</text>
<text x="100" y="1289" class="foot">GitHub and ImageGen are authoring tools; no Next.js server is required at runtime.</text>
