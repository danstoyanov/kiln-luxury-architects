<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K08 image crop review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e3e0d8;color:#282b28;font:17px/1.5 Arial,sans-serif}main{background:#f2f1ed;width:var(--width);padding-bottom:32px}header{padding:16px var(--gutter)}h1{font-size:24px;margin:0 0 8px}h2{font-size:22px;margin:0}p{margin:8px 0}a{color:inherit}img{display:block;width:100%;object-fit:cover}.hero{height:var(--hero-height);object-position:var(--hero-focus)}.projects{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:48px 24px;padding:32px var(--gutter)}figure{margin:0;min-width:0}figure img{height:auto;aspect-ratio:3/2;object-position:50% 50%}figure:nth-child(1){grid-column:1/8}figure:nth-child(2){grid-column:8/13;padding-top:96px}figure:nth-child(2) img{object-position:50% 55%}figure:nth-child(3){grid-column:3/13}figcaption{padding-top:12px}.single .projects{display:block}.single figure{padding-top:0;margin:0 0 32px}.note{padding:0 var(--gutter)}
</style></head><body><main>
<header><h1>K08 / ImageGen crop review</h1><p>AI-generated fictional residential concepts. Crop study only; these images are not yet integrated into the KILN page.</p><nav><a href="?view=desktop">1440 × 900</a> · <a href="?view=tablet">768 × 1024</a> · <a href="?view=phone">375 × 812</a> · <a href="?view=short">1366 × 768</a></nav><p id="scenario"></p></header>
<img class="hero" src="originals/hero.png" width="1536" height="1024" alt="Concept visualisation: pale stone home with timber canopy and living room opening onto a planted garden.">
<p class="note">Hero — frame and focal point from DESIGN.md. No colour filters or overlays.</p>
<section class="projects" aria-label="Three residential concept image studies">
<figure><img src="originals/courtyard.png" width="1536" height="1024" alt="Concept visualisation: a planted internal courtyard enclosed by pale walls and a glazed living room."><figcaption><h2>Courtyard House</h2><p>Planted centre, enclosing walls, shaded circulation and living-room connection.</p></figcaption></figure>
<figure><img src="originals/ridge.png" width="1536" height="1024" alt="Concept visualisation: low stone house with deep timber eaves grounded on a grassy hillside above an open horizon."><figcaption><h2>Ridge House</h2><p>Complete horizontal volume, supported eave, stone base and open horizon.</p></figcaption></figure>
<figure><img src="originals/woodland.png" width="1536" height="1024" alt="Concept visualisation: compact timber home in a woodland with a sheltered entrance and a dining table visible through an opening."><figcaption><h2>Woodland Retreat</h2><p>Compact timber volume, protected entrance, steps and shared table.</p></figcaption></figure>
</section></main><script>
const views={desktop:{w:1440,h:900,g:32},tablet:{w:768,h:1024,g:24},phone:{w:375,h:812,g:16},short:{w:1366,h:768,g:32}};
const view=views[new URLSearchParams(location.search).get('view')]||views.desktop;
const main=document.querySelector('main');main.style.setProperty('--width',view.w+'px');main.style.setProperty('--gutter',view.g+'px');
const heroHeight=view.w>=900?Math.max(192,Math.min(view.h-view.w*.1665-144,view.h*.56)):view.w>=600?Math.max(240,Math.min(view.h*.4,448)):Math.max(192,Math.min(view.h*.34,320));
main.style.setProperty('--hero-height',heroHeight+'px');main.style.setProperty('--hero-focus',view.w<600?'58% 50%':'50% 55%');
if(view.w<900)main.classList.add('single');
document.querySelector('#scenario').textContent=view.w+' × '+view.h+' CSS px scenario; hero '+view.w+' × '+heroHeight.toFixed(2)+'; projects 3:2. Image crop study; not a screenshot of the integrated KILN page.';
</script></body></html>
